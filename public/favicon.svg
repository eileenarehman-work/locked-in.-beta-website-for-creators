    <path d="M -26 -48 Q 0 -58 24 -48" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M -32 -14 Q -20 -20 -10 -14" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <path d="M 10 -14 Q 20 -20 32 -14" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <path d="M -38 8 C -34 2, -28 4, -26 12 C -24 18, -28 22, -34 20" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <path d="M -26 14 Q 0 24 26 14" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <path d="M 38 8 C 34 2, 28 4, 26 12 C 24 18, 28 22, 34 20" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" fill="none" />
