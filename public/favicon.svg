      <path d="M 345 125 L 343 80" />
      <path d="M 388 150 L 406 112" />
      <path d="M 425 210 L 452 170" />
      <path d="M 432 268 Q 455 264 478 262" fill="none" />
      <path d="M 408 340 Q 425 348 444 356" fill="none" />
      <path d="M 312 148 L 290 120" />
      <path d="M 276 195 L 244 180" />
      <path d="M 264 262 L 225 262" />
      <path d="M 280 328 L 240 338" />
    </g>

    <!-- LIGHT BULB -->
    <g id="lightbulb" transform="translate(345, 280)">
      <path d="M -32 50 L 32 50 L 32 120 C 32 130 18 135 0 135 C -18 135 -32 130 -32 120 Z" fill="#c5cbd6" stroke="#1e293b" stroke-width="5" />
      <line x1="-30" y1="66" x2="30" y2="66" stroke="#718096" stroke-width="4.5" stroke-linecap="round" />
      <line x1="-30" y1="82" x2="30" y2="82" stroke="#718096" stroke-width="4.5" stroke-linecap="round" />
      <line x1="-30" y1="98" x2="30" y2="98" stroke="#718096" stroke-width="4.5" stroke-linecap="round" />
      <line x1="-28" y1="114" x2="28" y2="114" stroke="#718096" stroke-width="4.5" stroke-linecap="round" />
      <path d="M -22 128 Q 0 136 22 128" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
      <ellipse cx="0" cy="-26" rx="75" ry="78" fill="url(#favBulbFillGrad)" stroke="#e69500" stroke-width="5.5" />
      <ellipse cx="-1" cy="-25" rx="74" ry="77" fill="none" stroke="#d97706" stroke-width="3" opacity="0.8" />
    </g>
