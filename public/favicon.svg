    <circle cx="-28" cy="-14" r="6" fill="#22c55e" /><circle cx="22" cy="-14" r="5.5" fill="#1e293b" />
    <path d="M -20 16 Q 0 36 22 16" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
