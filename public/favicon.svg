      <path d="M 270 80 C 310 140, 360 140, 410 90 L 370 40 Z" fill="#a2e8af" />
      <path d="M 270 80 C 310 140, 360 140, 410 90" stroke="#1e293b" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M 130 180 C 195 210, 215 250, 205 285 C 195 325, 205 375, 255 395 C 285 405, 280 470, 240 500 L 110 490 L 80 140 Z" fill="#a2e8af" />
      <path d="M 130 180 C 195 210, 215 250, 205 285 C 195 325, 205 375, 255 395 C 285 405, 280 470, 240 500" stroke="#1e293b" stroke-width="7.5" stroke-linecap="round" fill="none" />
      <path d="M 430 250 C 460 270, 520 260, 570 230 L 570 470 L 370 560 C 400 515, 410 450, 390 395 C 380 355, 410 310, 465 285 Z" fill="#a2e8af" />
      <path d="M 430 250 C 460 270, 520 260, 570 230" stroke="#1e293b" stroke-width="7.5" stroke-linecap="round" fill="none" />
      <path d="M 370 560 C 400 515, 410 450, 390 395 C 380 355, 410 310, 465 285" stroke="#1e293b" stroke-width="7.5" stroke-linecap="round" fill="none" />
