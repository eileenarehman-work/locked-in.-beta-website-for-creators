<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" fill="none">
  <defs>
    <radialGradient id="favBulbFillGrad" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stopColor="#ffdc40" />
      <stop offset="85%" stopColor="#fec92a" />
      <stop offset="100%" stopColor="#f59e0b" />
    </radialGradient>
    <clipPath id="favDiamondClip">
      <rect
        x="195"
        y="155"
        width="310"
        height="310"
        rx="48"
        transform="rotate(45 350 310)"
      />
    </clipPath>
  </defs>

  <!-- 1. CENTER DIAMOND EARTH -->
  <g id="center-diamond">
